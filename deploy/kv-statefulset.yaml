apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kv
  namespace: helix
spec:
  serviceName: kv
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kv
  template:
    metadata:
      labels:
        app: kv
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: kvnode
          image: helix/kvnode:dev
          imagePullPolicy: Never
          args:
            - --id=$(NODE_ID)
            - --client-addr=:8000
            - --raft-addr=:7000
            - --data-dir=/data
            - --read-mode=$(READ_MODE)
            - --peers=$(PEERS)
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: READ_MODE
              value: leader
            - name: PEERS
              value: kv-0=kv-0.kv.helix.svc.cluster.local:7000,kv-1=kv-1.kv.helix.svc.cluster.local:7000,kv-2=kv-2.kv.helix.svc.cluster.local:7000
          ports:
            - name: client
              containerPort: 8000
            - name: raft
              containerPort: 7000
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # tmpfs, not a PVC: host btrfs fsync stalls (up to 3 s) caused spurious elections.
        # Injected faults kill or pause kvnode inside a live pod, so tmpfs state survives them.
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
